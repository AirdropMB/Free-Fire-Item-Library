name: Sync Data & Fetch Icons

on:
  schedule:
    - cron: '0 */1 * * *'   # Tự chạy mỗi 1 tiếng 1 lần để giảm chậm trễ
  workflow_dispatch:           # Cho phép chạy thủ công trên GitHub Actions

concurrency:
  group: freefire-repo-sync
  cancel-in-progress: true

jobs:
  sync-and-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55   # Job phải xong trong 55 phút (dưới 1 tiếng của chu kỳ cron)
    permissions:
      contents: write

    steps:
      - name: Checkout repo này
        uses: actions/checkout@v4

      # ===== BẢN LIVE (giữ nguyên tên file ở root để không phá logic cũ) =====
      - name: Tải ItemsData_en.json (Live) mới nhất
        run: |
          curl -fsSL "https://raw.githubusercontent.com/KingofGames02/Free-Fire-Items-Library/main/Data/live/FF_ItemsData.json" \
            -o ItemsData_en.json

      - name: Tải CollectionBanner.json (Live) mới nhất
        run: |
          curl -fsSL "https://raw.githubusercontent.com/KingofGames02/Free-Fire-Items-Library/main/Data/live/CollectionBanner.json" \
            -o CollectionBanner.json

      - name: Tải IconCDNMap.json (Live, dùng làm fallback CDN cho icon)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/KingofGames02/Free-Fire-Items-Library/main/Data/live/IconCDNMap.json" \
            -o IconCDNMap.json

      - name: Tải FF_LocId.json + loc_en.txt + loc_vn.txt (Live, để resolve Name/Desc)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/KingofGames02/Free-Fire-Items-Library/main/Data/live/FF_LocId.json" \
            -o FF_LocId.json
          curl -fsSL "https://raw.githubusercontent.com/KingofGames02/Free-Fire-Items-Library/main/Data/live/loc_en.txt" \
            -o loc_en.txt
          curl -fsSL "https://raw.githubusercontent.com/KingofGames02/Free-Fire-Items-Library/main/Data/live/loc_vn.txt" \
            -o loc_vn.txt

      # Nhân bản dữ liệu thô (Name/Desc còn ở dạng TXT_...) làm nguồn cho bản VN,
      # PHẢI làm TRƯỚC bước resolve EN vì resolve-loc.js ghi đè trực tiếp vào file.
      - name: Tạo bản sao dữ liệu thô cho ItemsData_vn.json
        run: cp ItemsData_en.json ItemsData_vn.json

      # ===== BẢN ADVANCE / OB TEST SERVER (lưu file riêng, không đè lên bản Live) =====
      - name: Tải FFAdv_ItemsData.json (Advance) mới nhất
        run: |
          curl -fsSL "https://raw.githubusercontent.com/KingofGames02/Free-Fire-Items-Library/main/Data/advance/FFAdv_ItemsData.json" \
            -o ItemsData_en_advance.json

      - name: Tải CollectionBanner.json (Advance) mới nhất
        run: |
          curl -fsSL "https://raw.githubusercontent.com/KingofGames02/Free-Fire-Items-Library/main/Data/advance/CollectionBanner.json" \
            -o CollectionBanner_advance.json

      - name: Tải FFAdv_LocId.json + loc_en.txt (Advance, để resolve Name/Desc dạng TXT_...)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/KingofGames02/Free-Fire-Items-Library/main/Data/advance/FFAdv_LocId.json" \
            -o FFAdv_LocId.json
          curl -fsSL "https://raw.githubusercontent.com/KingofGames02/Free-Fire-Items-Library/main/Data/advance/loc_en.txt" \
            -o loc_en_advance.txt

      # Lưu ý: ignore_list.json đã bị repo nguồn loại bỏ hoàn toàn (404 ở mọi path).
      # Nếu bạn vẫn cần danh sách ignore, hãy tự duy trì file ignore_list.json thủ công
      # trong repo này (đừng để step tự động tải đè lên nữa).

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Name/Desc dạng TXT_... thành text thật (EN, VN chính thức, Advance)
        run: |
          node resolve-loc.js ItemsData_en.json FF_LocId.json loc_en.txt
          node resolve-loc.js ItemsData_vn.json FF_LocId.json loc_vn.txt
          node resolve-loc.js ItemsData_en_advance.json FFAdv_LocId.json loc_en_advance.txt

      - name: Chạy fetch icons
        run: node fetch-icons.js

      - name: Commit và push nếu có thay đổi
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-synced data & icons [1h]"
          file_pattern: 'ItemsData_en.json ItemsData_en_advance.json ItemsData_vn.json ItemsData_zh.json CollectionBanner.json CollectionBanner_advance.json IconCDNMap.json FF_LocId.json loc_en.txt loc_vn.txt FFAdv_LocId.json loc_en_advance.txt icons/ icons_advance/ updated_icons.json updated_icons_advance.json'
