const CDN_ID_URL = 'https://dl.cdn.freefiremobile.com/live/ABHotUpdates/IconCDN/other/';
const CDN_NAME_URL = 'https://freefiremobile-a.akamaihd.net/common/Local/PK/FF_UI_Icon/';

// Hàm tự động chọn CDN phù hợp dựa vào ID hay Tên Icon
async function tryDownloadCDN(targetId, targetIconsDir) {
    const fileName = `${targetId}.png`;
    const filePath = path.join(targetIconsDir, fileName);

    // Kiểm tra xem file đã có sẵn & là ảnh thật (>= 5KB) chưa
    if (!FORCE_UPDATE && fs.existsSync(filePath)) {
        const fileStat = fs.statSync(filePath);
        if (fileStat.size >= PLACEHOLDER_SIZE_LIMIT) {
            stats.skipped++;
            return true;
        }
        console.log(`[REPLACE] Phát hiện ảnh che/đen (${fileStat.size}b), đang thay thế: ${fileName}`);
    }

    // Nếu chỉ gồm chữ số -> Dùng CDN ID. Nếu chứa chữ cái -> Dùng CDN Akamai cho Tên Icon
    const isOnlyNumbers = /^\d+$/.test(targetId);
    const baseUrl = isOnlyNumbers ? CDN_ID_URL : CDN_NAME_URL;
    const url = `${baseUrl}${targetId}.png`;

    const res = await fetchWithRetry(url);

    if (res) {
        const buffer = Buffer.from(await res.arrayBuffer());
        if (buffer.length >= PLACEHOLDER_SIZE_LIMIT) {
            fs.writeFileSync(filePath, buffer);
            stats.downloaded++;
            console.log(`[SUCCESS] Downloaded: ${fileName} từ ${isOnlyNumbers ? 'CDN ID' : 'CDN Akamai'}`);
            return true;
        }
    }
    return false;
}
